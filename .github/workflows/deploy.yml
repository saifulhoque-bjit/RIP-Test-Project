# Generated by AMS because this repository had no deploy workflow.
#
# AMS reads this file; it does not own it. Edit it freely -- AMS only starts it
# and reports how it ended.
#
# This job runs on a self-hosted runner installed on the deploy target. GitHub's
# own runners live in its cloud and cannot reach a server on a private network,
# so a self-hosted runner is not a preference here but a requirement. It also
# means no credential for the server is stored anywhere: the runner is already
# on the machine.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ams_deploy_commit:
        description: The commit AMS asks for. Empty deploys the branch head.
        required: false
        type: string

# One deploy at a time. Two runs of this workflow racing each other onto one
# server is the failure that is hardest to understand afterwards.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Read back by AMS from the job log: what a rollback of this deploy
      # puts back. Empty on a runner that has not checked anything out yet.
      - name: Report the commit the server ran before
        shell: bash
        run: echo "ams-previous-commit=$(git rev-parse HEAD 2>/dev/null || true)"

      # The commit AMS asked for, or the branch head when it asked for none.
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ams_deploy_commit || github.sha }}

      # Read back by AMS from the job log: the commit that actually shipped.
      - name: Report the commit being deployed
        shell: bash
        run: echo "ams-deployed-commit=$(git rev-parse HEAD)"

      - name: Deploy
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_DIR=/home/bjit/rip   # the app's checkout on the server
          COMPOSE_DIR=.               # the folder in DEPLOY_DIR that holds docker-compose.yml

          git fetch --unshallow --no-tags origin 2>/dev/null || true
          sha=$(git rev-parse HEAD)
          git -C "$DEPLOY_DIR" fetch --no-tags "$GITHUB_WORKSPACE" "$sha"
          git -C "$DEPLOY_DIR" reset --hard "$sha"
          cd "$DEPLOY_DIR/$COMPOSE_DIR"
          docker compose up -d --build
          docker compose ps
